tools:
  http-status-codes:
    searchPlaceholder: 'Search http status...'
    searchResults: 'Search results'
    forType: 'For {type}.'
    categories:
      c1xx: '1xx informational response'
      c2xx: '2xx success'
      c3xx: '3xx redirection'
      c4xx: '4xx client error'
      c5xx: '5xx server error'
    codes:
      c100: 'Waiting for the client to emit the body of the request.'
      c101: 'The server has agreed to change protocol.'
      c102: 'The server is processing the request, but no response is available yet.'
      c103: 'The server returns some response headers before final HTTP message.'
      c200: 'Standard response for successful HTTP requests.'
      c201: 'The request has been fulfilled, resulting in the creation of a new resource.'
      c202: 'The request has been accepted for processing, but the processing has not been completed.'
      c203: 'The request is successful but the content of the original request has been modified by a transforming proxy.'
      c204: 'The server successfully processed the request and is not returning any content.'
      c205: 'The server indicates to reinitialize the document view which sent this request.'
      c206: 'The server is delivering only part of the resource due to a range header sent by the client.'
      c207: 'The message body that follows is an XML message and can contain a number of separate response codes.'
      c208: 'The members of a DAV binding have already been enumerated in a preceding part of the (multistatus) response.'
      c226: 'The server has fulfilled a request for the resource, and the response is a representation of the result.'
      c300: 'Indicates multiple options for the resource that the client may follow.'
      c301: 'This and all future requests should be directed to the given URI.'
      c302: 'Redirect to another URL. This is an example of industry practice contradicting the standard.'
      c303: 'The response to the request can be found under another URI using a GET method.'
      c304: 'Indicates that the resource has not been modified since the version specified by the request headers.'
      c305: 'The requested resource is available only through a proxy, the address for which is provided in the response.'
      c306: 'No longer used. Originally meant "Subsequent requests should use the specified proxy."'
      c307: 'In this case, the request should be repeated with another URI; however, future requests should still use the original URI.'
      c308: 'The request and all future requests should be repeated using another URI.'
      c400: 'The server cannot or will not process the request due to an apparent client error.'
      c401: 'Similar to 403 Forbidden, but specifically for use when authentication is required and has failed or has not yet been provided.'
      c402: 'Reserved for future use. The original intention was that this code might be used as part of some form of digital cash or micropayment scheme.'
      c403: 'The request was valid, but the server is refusing action. The user might not have the necessary permissions for a resource.'
      c404: 'The requested resource could not be found but may be available in the future.'
      c405: 'A request method is not supported for the requested resource.'
      c406: 'The requested resource is capable of generating only content not acceptable according to the Accept headers sent in the request.'
      c407: 'The client must first authenticate itself with the proxy.'
      c408: 'The server timed out waiting for the request.'
      c409: 'Indicates that the request could not be processed because of conflict in the request, such as an edit conflict.'
      c410: 'Indicates that the resource requested is no longer available and will not be available again.'
      c411: 'The request did not specify the length of its content, which is required by the requested resource.'
      c412: 'The server does not meet one of the preconditions that the requester put on the request.'
      c413: 'The request is larger than the server is willing or able to process.'
      c414: 'The URI provided was too long for the server to process.'
      c415: 'The request entity has a media type which the server or resource does not support.'
      c416: 'The client has asked for a portion of the file, but the server cannot supply that portion.'
      c417: 'The server cannot meet the requirements of the Expect request-header field.'
      c421: 'The request was directed at a server that is not able to produce a response.'
      c422: 'The request was well-formed but was unable to be followed due to semantic errors.'
      c423: 'The resource that is being accessed is locked.'
      c424: 'The request failed due to failure of a previous request.'
      c425: 'Indicates that the server is unwilling to risk processing a request that might be replayed.'
      c426: 'The client should switch to a different protocol such as TLS/1.0.'
      c428: 'The origin server requires the request to be conditional.'
      c429: 'The user has sent too many requests in a given amount of time.'
      c431: 'The server is unwilling to process the request because either an individual header field, or all the header fields collectively, are too large.'
      c451: 'A server operator has received a legal demand to deny access to a resource or to a set of resources that includes the requested resource.'
      c500: 'A generic error message, given when an unexpected condition was encountered and no more specific message is suitable.'
      c501: 'The server either does not recognize the request method, or it lacks the ability to fulfill the request.'
      c502: 'The server was acting as a gateway or proxy and received an invalid response from the upstream server.'
      c503: 'The server is currently unavailable (because it is overloaded or down for maintenance).'
      c504: 'The server was acting as a gateway or proxy and did not receive a timely response from the upstream server.'
      c505: 'The server does not support the HTTP protocol version used in the request.'
      c506: 'Transparent content negotiation for the request results in a circular reference.'
      c507: 'The server is unable to store the representation needed to complete the request.'
      c508: 'The server detected an infinite loop while processing the request.'
      c510: 'Further extensions to the request are required for the server to fulfill it.'
      c511: 'The client needs to authenticate to gain network access.'
