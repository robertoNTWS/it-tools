tools:
  http-status-codes:
    searchPlaceholder: 'Buscar status HTTP...'
    searchResults: 'Resultados da busca'
    forType: 'Para {type}.'
    categories:
      c1xx: '1xx: respostas informativas'
      c2xx: '2xx: sucesso'
      c3xx: '3xx: redirecionamento'
      c4xx: '4xx: erros do cliente'
      c5xx: '5xx: erros do servidor'
    codes:
      c100: 'Aguardando o cliente enviar o corpo da requisição.'
      c101: 'O servidor aceitou trocar de protocolo.'
      c102: 'O servidor está processando a requisição, mas ainda não há resposta disponível.'
      c103: 'O servidor envia alguns headers de resposta antes da mensagem HTTP final.'
      c200: 'Resposta padrão para requisições HTTP bem-sucedidas.'
      c201: 'A requisição foi atendida e resultou na criação de um novo recurso.'
      c202: 'A requisição foi aceita para processamento, mas o processamento ainda não terminou.'
      c203: 'A requisição foi bem-sucedida, mas o conteúdo original foi modificado por um proxy de transformação.'
      c204: 'O servidor processou a requisição com sucesso e não retorna conteúdo.'
      c205: 'O servidor indica que a visualização do documento que enviou a requisição deve ser reiniciada.'
      c206: 'O servidor entrega só parte do recurso, por causa de um header Range enviado pelo cliente.'
      c207: 'O corpo da mensagem é um XML que pode conter vários códigos de resposta separados.'
      c208: 'Os membros de um binding DAV já foram listados em uma parte anterior da resposta (multistatus).'
      c226: 'O servidor atendeu a requisição do recurso, e a resposta representa o resultado.'
      c300: 'Indica várias opções para o recurso que o cliente pode seguir.'
      c301: 'Esta e todas as próximas requisições devem ser direcionadas para a URI informada.'
      c302: 'Redireciona para outra URL. É um exemplo de prática do mercado que contradiz o padrão.'
      c303: 'A resposta pode ser encontrada em outra URI, usando o método GET.'
      c304: 'Indica que o recurso não foi modificado desde a versão informada nos headers da requisição.'
      c305: 'O recurso só está disponível por meio de um proxy, cujo endereço vem na resposta.'
      c306: 'Não é mais usado. Originalmente significava "as próximas requisições devem usar o proxy indicado".'
      c307: 'A requisição deve ser repetida em outra URI; as próximas requisições, porém, devem continuar usando a URI original.'
      c308: 'Esta e todas as próximas requisições devem ser repetidas em outra URI.'
      c400: 'O servidor não pode ou não vai processar a requisição por causa de um aparente erro do cliente.'
      c401: 'Semelhante ao 403 Forbidden, mas usado quando a autenticação é necessária e falhou ou ainda não foi fornecida.'
      c402: 'Reservado para uso futuro. A ideia original era usá-lo em algum esquema de dinheiro digital ou micropagamento.'
      c403: 'A requisição é válida, mas o servidor se recusa a executá-la. O usuário pode não ter as permissões necessárias para o recurso.'
      c404: 'O recurso solicitado não foi encontrado, mas pode ficar disponível no futuro.'
      c405: 'O método da requisição não é suportado pelo recurso solicitado.'
      c406: 'O recurso só consegue gerar conteúdo não aceito pelos headers Accept enviados na requisição.'
      c407: 'O cliente precisa primeiro se autenticar no proxy.'
      c408: 'O tempo limite do servidor esgotou enquanto aguardava a requisição.'
      c409: 'Indica que a requisição não pôde ser processada por causa de um conflito, como um conflito de edição.'
      c410: 'Indica que o recurso solicitado não está mais disponível e não voltará a estar.'
      c411: 'A requisição não informou o tamanho do conteúdo, exigido pelo recurso solicitado.'
      c412: 'O servidor não atende a uma das pré-condições definidas pelo solicitante na requisição.'
      c413: 'A requisição é maior do que o servidor aceita ou consegue processar.'
      c414: 'A URI informada é longa demais para o servidor processar.'
      c415: 'A entidade da requisição tem um tipo de mídia que o servidor ou o recurso não suporta.'
      c416: 'O cliente pediu uma parte do arquivo, mas o servidor não consegue fornecê-la.'
      c417: 'O servidor não consegue atender aos requisitos do header Expect da requisição.'
      c421: 'A requisição foi direcionada a um servidor que não consegue produzir uma resposta.'
      c422: 'A requisição está bem formada, mas não pôde ser atendida por causa de erros semânticos.'
      c423: 'O recurso acessado está bloqueado.'
      c424: 'A requisição falhou porque uma requisição anterior falhou.'
      c425: 'Indica que o servidor não quer correr o risco de processar uma requisição que pode ser repetida.'
      c426: 'O cliente deve trocar para outro protocolo, como TLS/1.0.'
      c428: 'O servidor de origem exige que a requisição seja condicional.'
      c429: 'O usuário enviou requisições demais em um intervalo de tempo.'
      c431: 'O servidor não quer processar a requisição porque um header, ou o conjunto de headers, é grande demais.'
      c451: 'O operador do servidor recebeu uma ordem legal para bloquear o acesso a um recurso ou a um conjunto de recursos que inclui o solicitado.'
      c500: 'Mensagem de erro genérica, usada quando ocorre uma condição inesperada e nenhuma mensagem mais específica se aplica.'
      c501: 'O servidor não reconhece o método da requisição ou não tem capacidade para atendê-la.'
      c502: 'O servidor, atuando como gateway ou proxy, recebeu uma resposta inválida do servidor upstream.'
      c503: 'O servidor está indisponível no momento (sobrecarregado ou em manutenção).'
      c504: 'O servidor, atuando como gateway ou proxy, não recebeu resposta a tempo do servidor upstream.'
      c505: 'O servidor não suporta a versão do protocolo HTTP usada na requisição.'
      c506: 'A negociação transparente de conteúdo da requisição resulta em uma referência circular.'
      c507: 'O servidor não consegue armazenar a representação necessária para concluir a requisição.'
      c508: 'O servidor detectou um loop infinito ao processar a requisição.'
      c510: 'São necessárias outras extensões na requisição para que o servidor possa atendê-la.'
      c511: 'O cliente precisa se autenticar para obter acesso à rede.'
