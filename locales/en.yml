about:
  content: >
    # Sobre o IT-Tools

    Este site incrível, feito com ❤ por [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) , reúne ferramentas úteis para desenvolvedores e profissionais de TI. Se você achou útil, fique à vontade para compartilhar com quem possa se beneficiar também e não se esqueça de adicioná-lo aos favoritos do seu navegador!

    O IT Tools é de código aberto (sob a licença GPL-3.0) e gratuito, e sempre será, mas hospedar o site e renovar o domínio tem um custo para mim. Se você quiser apoiar meu trabalho e me incentivar a adicionar mais ferramentas, considere contribuir [patrocinando o projeto](https://www.buymeacoffee.com/cthmsst).

    ## Tecnologias

    O IT Tools é feito em Vue.js (Vue 3) com a biblioteca de componentes Naive UI e é hospedado e implantado continuamente pela Vercel. Bibliotecas de código aberto de terceiros são usadas em algumas ferramentas; você pode encontrar a lista completa no arquivo [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) do repositório.

    ## Encontrou um bug? Está faltando uma ferramenta?

    Se você precisa de uma ferramenta que ainda não está aqui e acredita que ela pode ser útil, fique à vontade para enviar uma solicitação de recurso na [seção de issues](https://github.com/CorentinTh/it-tools/issues/new/choose) do repositório no GitHub.

    E se você encontrou um bug ou algo não funciona como esperado, abra um relatório de bug na [seção de issues](https://github.com/CorentinTh/it-tools/issues/new/choose) do repositório no GitHub.

