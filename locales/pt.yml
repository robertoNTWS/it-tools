about:
  content: >
    # Sobre o Canidev Suíço

    O Canidev Suíço reúne ferramentas úteis para desenvolvedores e profissionais de TI, prontas para usar direto no navegador. Os dados que você digita são processados no seu próprio dispositivo e não são salvos nem enviados para servidores.

    ## Projeto original e licença

    O Canidev Suíço é uma versão em português do Brasil, com visual próprio, do [IT Tools](https://github.com/CorentinTh/it-tools), projeto de código aberto criado por [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about). Assim como o original, é distribuído sob a licença GPL-3.0, e o código-fonte desta versão está disponível no [GitHub](https://github.com/robertoNTWS/it-tools).

    Se quiser apoiar o autor do projeto original, você pode [pagar um café para ele](https://www.buymeacoffee.com/cthmsst).

    ## Tecnologias

    O Canidev Suíço é feito em Vue.js (Vue 3) com a biblioteca de componentes Naive UI e hospedado na Vercel. Algumas ferramentas usam bibliotecas de código aberto de terceiros; a lista completa está no arquivo [package.json](https://github.com/robertoNTWS/it-tools/blob/main/package.json) do repositório.

    ## Encontrou um bug? Sentiu falta de uma ferramenta?

    Envie um e-mail para [roberto.ntws{'@'}gmail.com](mailto:roberto.ntws{'@'}gmail.com) descrevendo o problema ou a sugestão.

